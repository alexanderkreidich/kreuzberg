# ---------------------------------------------------------------------------
# Output directories
# ---------------------------------------------------------------------------

[output]
python = "crates/kreuzberg-py/src/"
node = "crates/kreuzberg-node/src/"
ruby = "packages/ruby/ext/kreuzberg_rb/src/"
php = "crates/kreuzberg-php/src/"
ffi = "crates/kreuzberg-ffi/src/"
go = "packages/go/"
elixir = "packages/elixir/native/kreuzberg_nif/src/"
wasm = "crates/kreuzberg-wasm/src/"
java = "packages/java/src/main/java/dev/kreuzberg/"
csharp = "packages/csharp/src/"
r = "packages/r/src/rust/src/"

# ---------------------------------------------------------------------------
# Language-specific configuration
# ---------------------------------------------------------------------------

[python]
module_name = "_kreuzberg"
exclude_functions = [
    # Functions with complex type conversions (Vec<&str>, &mut [T])
    "detect_topic_boundaries",
    "generate_embeddings_for_chunks",
]

[python.stubs]
output = "packages/python/kreuzberg/"

[node]
package_name = "kreuzberg"

[ffi]
prefix = "kreuzberg"
header_name = "kreuzberg.h"
lib_name = "kreuzberg_ffi"
visitor_callbacks = false

[go]
module = "github.com/kreuzberg-dev/kreuzberg/v4"
package_name = "kreuzberg"

[java]
package = "dev.kreuzberg"
ffi_style = "panama"

[csharp]
namespace = "Kreuzberg"

[ruby]
gem_name = "kreuzberg"
exclude_functions = [
    # Functions that depend on OutputFormat type collision workaround
    "apply_output_format",
]

[elixir]
app_name = "kreuzberg"
exclude_functions = [
    # Functions returning non-FFI-compatible types (cannot convert to string)
    "sort_cache_by_access_time",
    "create_router_with_limits",
    "create_router_with_limits_and_server_config",
    "create_router",
    # Functions with struct reference parameters that can't be converted properly
    "validate_vlm_backend_config",
    "validate_backend_config",
    "apply_output_format",
    "render_inline_content",
    "string_from_utf8",
    "calculate_quality_score",
    # Functions with Vec<T> parameters that can't be marshalled through NIF boundary
    "validate_page_boundaries",
    "validate_utf8_boundaries",
    "chunk_text",
    "chunk_text_with_heading_source",
    "chunk_semantic",
    "assemble_ocr_markdown",
    "apply_heuristics",
    "greedy_nms",
    "sort_by_confidence_desc",
    "elements_to_hocr_words",
    "assign_hierarchy_levels_from_clusters",
    "merge_chars_into_blocks",
    "merge_segments",
    # Functions with problematic type conversions
    "should_trigger_ocr",
    "warm_model",
    "download_model",
    "take_or_create_engine",
    "return_engine",
    "take_or_create_tatr",
    "take_or_create_table_classifier",
    "take_or_create_slanet",
    "list_presets",
    "map_language_code",
    "is_language_supported",
    # Functions with Cow/reference return types or complex conversions
    "classify_chunk",
    "config_from_extraction",
    "detect_page_breaks_from_docx",
    "element_to_hocr_word",
    "extract_and_process_embedded_files",
    "extract_ooxml_embedded_objects",
    "transform_extraction_result_to_elements",
    "transform_to_document_structure",
    # Methods with type conversion issues (Cow, &str, reference returns)
    "normalized",
    "effective_pipeline",
    "fmt",
    "get",
    "from",
    # Uri static constructors — take &str params but NIF passes owned String
    "hyperlink",
    "image",
    "citation",
    "anchor",
    "email",
    "reference",
]
exclude_types = [
    # Trait types cannot be FFI-bound
    "SyncExtractor",
    "Recyclable",
]

[php]
extension_name = "kreuzberg"
exclude_functions = [
    # Functions taking Vec<PageBoundary> which ext-php-rs can't convert from PHP arrays
    "chunk_semantic",
    # Functions taking Vec<NonOpaqueType> which ext-php-rs can't convert from PHP arrays
    "validate_page_boundaries",
    "validate_utf8_boundaries",
    "greedy_nms",
    "sort_by_confidence_desc",
    "detect_layout_for_images",
    "recognize_page_tables",
    "render_inline_content",
    "generate_embeddings_for_chunks",
    "elements_to_hocr_words",
    "assign_hierarchy_levels_from_clusters",
    "merge_chars_into_blocks",
    "chunk_text",
    "chunk_text_with_heading_source",
    "assemble_ocr_markdown",
    "apply_heuristics",
    "assign_heading_levels_smart",
    # Enum conversion functions (take enums excluded from PHP)
    "chunk_text_with_type",
    "warm_model",
    "download_model",
    # Takes OutputFormat enum as a parameter (excluded type, no From<String>)
    "apply_output_format",
    # Returns PooledString which is excluded from PHP bindings
    "acquire_string_buffer",
]
exclude_types = [
    # Enum types that don't have From<String> implementation for PHP
    "ChunkerType",
    "OutputFormat",
    "EmbeddingModelType",
    "UriKind",
    "ChunkType",
    # PooledString has methods incompatible with ext-php-rs (buffer_mut, deref_mut, fmt(f))
    # that trigger E0716/E0596/E0507 in the #[php_impl] macro expansion.
    "PooledString",
]

[r]
package_name = "kreuzberg"

